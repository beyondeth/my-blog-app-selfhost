name: Deploy Aigory to Oracle

on:
  workflow_run:
    workflows: ["Aigory production quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA that passed the quality workflow
        required: true
        type: string
      initial_cutover:
        description: Permanently delete the old material workload before first start
        required: true
        default: false
        type: boolean

concurrency:
  group: aigory-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
      INITIAL_CUTOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.initial_cutover || false }}
    steps:
      - name: Verify quality workflow completed successfully
        if: github.event_name == 'workflow_run'
        env:
          QUALITY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          QUALITY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          QUALITY_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          test "$QUALITY_CONCLUSION" = success
          test "$QUALITY_BRANCH" = main
          test "$QUALITY_EVENT" = push

      - name: Validate immutable release reference
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'release_sha must be a full commit SHA' >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify checked-out SHA and package release
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git archive --format=tar.gz --output=aigory-release.tar.gz "$RELEASE_SHA"

      - name: Materialize protected production environment
        env:
          AIGORY_ENV_FILE_BASE64: ${{ secrets.AIGORY_ENV_FILE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$AIGORY_ENV_FILE_BASE64" | base64 --decode > aigory.env
          test -s aigory.env
          grep -q '^NEXT_PUBLIC_SITE_URL=https://aigory.com$' aigory.env
          grep -q '^PAYMENTS_ENABLED=false$' aigory.env
          grep -q '^MOCK_PAYMENT_ENABLED=false$' aigory.env
          grep -q '^ADMIN_DEBUG_ENABLED=false$' aigory.env
          grep -q '^BACKUP_S3_BUCKET=aigory-blog-prod-backups$' aigory.env

      - name: Upload immutable release
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.AIGORY_DEPLOY_HOST }}
          username: ${{ secrets.AIGORY_DEPLOY_USER }}
          key: ${{ secrets.AIGORY_DEPLOY_SSH_KEY }}
          source: aigory-release.tar.gz,aigory.env
          target: /tmp/aigory-deploy
          overwrite: true

      - name: Install and activate release
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
          INITIAL_CUTOVER: ${{ env.INITIAL_CUTOVER }}
        with:
          host: ${{ secrets.AIGORY_DEPLOY_HOST }}
          username: ${{ secrets.AIGORY_DEPLOY_USER }}
          key: ${{ secrets.AIGORY_DEPLOY_SSH_KEY }}
          port: 22
          timeout: 1200s
          command_timeout: 3000s
          envs: RELEASE_SHA,INITIAL_CUTOVER
          script_stop: true
          script: |
            set -Eeuo pipefail
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            release_dir="/opt/aigory-blog/releases/$RELEASE_SHA"
            sudo install -d -o ubuntu -g ubuntu -m 750 "$release_dir" /etc/aigory-blog
            tar -xzf /tmp/aigory-deploy/aigory-release.tar.gz -C "$release_dir"
            sudo install -o root -g root -m 600 /tmp/aigory-deploy/aigory.env /etc/aigory-blog/.env.production
            chmod +x "$release_dir/scripts/deploy-aigory-production.sh" "$release_dir/scripts/remove-material-ledger.sh" "$release_dir/scripts/backup-aigory-postgres.sh"
            sudo env INITIAL_CUTOVER="$INITIAL_CUTOVER" bash "$release_dir/scripts/deploy-aigory-production.sh" "$release_dir" "$RELEASE_SHA"
            rm -f /tmp/aigory-deploy/aigory-release.tar.gz /tmp/aigory-deploy/aigory.env
