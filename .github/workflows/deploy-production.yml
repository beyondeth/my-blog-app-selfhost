name: Deploy to Production (Oracle Free Tier)

# 메인 브랜치 푸시 시 자동 배포
on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 허용

# Concurrency control - 동시 실행 방지
concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 타임아웃 30분으로 단축 (최적화 완료)
    environment: production  # Environment Secrets 사용

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Environment Secrets에서 .env.production 생성
      - name: Create .env.production from Environment Secrets
        run: |
          cat > .env.production << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      # 2-1. 공개 환경변수(NEXT_PUBLIC_*) 누락 여부 사전 검증
      - name: Validate public env vars
        run: |
          set -e
          required_vars=(
            NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_BACKEND_URL
            NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_MIXPANEL_TOKEN
            NEXT_PUBLIC_GA_MEASUREMENT_ID
          )
          for var in "${required_vars[@]}"; do
            value="$(grep -E "^${var}=" .env.production | cut -d= -f2- || true)"
            if [ -z "$value" ]; then
              echo "::error::${var} is missing or empty in .env.production"
              exit 1
            fi
          done
          echo "✅ All required NEXT_PUBLIC env vars found."

      # 3. 배포 스크립트 및 환경 파일 업로드
      - name: Upload deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".env.production,scripts/deploy-production-optimized.sh"
          target: "/home/ubuntu/my-blog-app/"
          overwrite: true
          strip_components: 0

      # 4. SSH로 배포 스크립트 실행
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 900s  # 15분 SSH 타임아웃
          command_timeout: 900s
          script_stop: true  # 에러 발생 시 즉시 중단
          script: |
            set -e
            echo "=========================================="
            echo "프로덕션 배포 시작: $(date)"
            echo "=========================================="

            # 스크립트 실행 권한 설정
            chmod +x /home/ubuntu/my-blog-app/scripts/deploy-production-optimized.sh

            # 최적화된 배포 스크립트 실행
            cd /home/ubuntu/my-blog-app
            bash scripts/deploy-production-optimized.sh

            echo "=========================================="
            echo "✅ GitHub Actions 배포 완료"
            echo "=========================================="

      # 5. 배포 실패 시 알림
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ 프로덕션 배포 실패!"
          echo "롤백을 실행하세요: ssh ubuntu@server 'cd /home/ubuntu/my-blog-app && bash scripts/rollback.sh'"

      # 6. 배포 성공 시 알림
      - name: Notify on success
        if: success()
        run: |
          echo "✅ 프로덕션 배포 성공!"
