name: Deploy to Production (Oracle Free Tier)

# main 브랜치에 push 시 자동 배포
on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 허용

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 45분으로 대폭 증가 (msgpackr-extract 컴파일 시간 고려)
    environment: production  # Environment Secrets 사용

    steps:
      # 0. BuildKit 비활성화 (안정성 확보)
      - name: Disable Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=0" >> $GITHUB_ENV
          echo "COMPOSE_DOCKER_CLI_BUILD=0" >> $GITHUB_ENV

      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Environment Secrets에서 .env.production 생성
      - name: Create .env.production from Environment Secrets
        run: |
          cat > .env.production << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      # 3. .env.production 파일을 서버에 업로드
      - name: Upload .env.production to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".env.production"
          target: "/home/ubuntu/my-blog-app/"
          overwrite: true

      # 4. SSH로 프로덕션 서버 접속 및 배포
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 45m
          script_stop: true  # 에러 발생 시 즉시 중단
          script: |
            set -e
            echo "=========================================="
            echo "프로덕션 배포 시작: $(date)"
            echo "=========================================="

            cd /home/ubuntu/my-blog-app

            # 최신 코드 가져오기 (배포 스크립트 포함)
            echo "Step 0: Git Pull (main 브랜치)"
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Git Pull 완료"

            # 배포 스크립트 실행
            bash scripts/deploy-production.sh

            echo "=========================================="
            echo "배포 완료: $(date)"
            echo "=========================================="

      # 3. 배포 실패 시 알림 (선택사항)
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ 프로덕션 배포 실패!"
          echo "롤백을 실행하세요: ssh ubuntu@server 'cd /home/ubuntu/my-blog-app && bash scripts/rollback.sh'"
          # Slack/Discord 알림 (선택사항)
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"❌ 프로덕션 배포 실패"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

      # 4. 배포 성공 시 알림 (선택사항)
      - name: Notify on success
        if: success()
        run: |
          echo "✅ 프로덕션 배포 성공!"
          # Slack/Discord 알림 (선택사항)
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"✅ 프로덕션 배포 성공"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
