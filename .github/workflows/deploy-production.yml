name: Deploy to Production (Oracle Free Tier)

# 메인 브랜치 푸시 시 자동 배포
on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 허용

# Concurrency control - 동시 실행 방지
concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 타임아웃 60분으로 단축
    environment: production  # Environment Secrets 사용

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Environment Secrets에서 .env.production 생성
      - name: Create .env.production from Environment Secrets
        run: |
          cat > .env.production << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      # 3. .env.production 파일을 서버에 업로드
      - name: Upload .env.production to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".env.production"
          target: "/home/ubuntu/my-blog-app/"
          overwrite: true

      # 4. SSH로 프로덕션 서버 접속 및 배포
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 3600s  # 60분 타임아웃 (단위 필수)
          # Keep SSH connection alive
          command_timeout: 3600s
          script_stop: true  # 에러 발생 시 즉시 중단
          script: |
            set -e
            echo "=========================================="
            echo "프로덕션 배포 시작: $(date)"
            echo "=========================================="

            cd /home/ubuntu/my-blog-app

            # 최신 코드 가져오기
            echo "Step 0: Git Pull (main 브랜치)"
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Git Pull 완료"

            # 현재 커밋 해시 기록
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "현재 커밋: $CURRENT_COMMIT"

            # 환경 설정
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # 디스크 공간 확인
            DISK_USAGE=$(df / | awk 'NR==2 {print $5}' | tr -d '%')
            if [ "$DISK_USAGE" -ge 90 ]; then
              echo "디스크 공간 부족 (${DISK_USAGE}%). 정리 중..."
              docker system prune -a -f --volumes || true
            fi

            # 순차적 빌드 실행
            echo "Backend 빌드 시작..."
            docker compose -f docker-compose.prod.oracle.yml --env-file .env.production build backend

            echo "Frontend 빌드 시작..."
            docker compose -f docker-compose.prod.oracle.yml --env-file .env.production build frontend

            echo "MCP Proxy 빌드 시작..."
            docker compose -f docker-compose.prod.oracle.yml --env-file .env.production build mcp-proxy

            echo "모든 이미지 빌드 완료"

            # 컨테이너 재시작
            echo "컨테이너 재시작 중..."
            docker compose -f docker-compose.prod.oracle.yml --env-file .env.production up -d --force-recreate backend
            docker compose -f docker-compose.prod.oracle.yml --env-file .env.production up -d --force-recreate frontend
            docker compose -f docker-compose.prod.oracle.yml --env-file .env.production up -d --force-recreate mcp-proxy

            # 최종 상태 확인
            echo "배포 완료!"
            docker compose -f docker-compose.prod.oracle.yml --env-file .env.production ps

            echo "=========================================="
            echo "배포 완료: $(date)"
            echo "=========================================="

      # 5. 배포 실패 시 알림
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ 프로덕션 배포 실패!"
          echo "롤백을 실행하세요: ssh ubuntu@server 'cd /home/ubuntu/my-blog-app && bash scripts/rollback.sh'"

      # 6. 배포 성공 시 알림
      - name: Notify on success
        if: success()
        run: |
          echo "✅ 프로덕션 배포 성공!"