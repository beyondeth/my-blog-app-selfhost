name: Deploy to Production (Oracle Free Tier)

# 자동배포 트리거 변경: 프론트엔드 빌드( GHCR push ) 완료 후 실행
on:
  workflow_run:
    workflows:
      - "Build and Push Frontend (GHCR)"
      - "Build and Push Backend (GHCR)"
      - "Build and Push MCP Proxy (GHCR)"
    types:
      - completed
  workflow_dispatch:  # 수동 실행 허용

# Concurrency control - 동시 실행 방지
concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Reduced timeout as we are not building
    environment: production  # Environment Secrets使用

    steps:
      # 0. BuildKit 비활성화 (안정성 확보)
      - name: Disable Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=0" >> $GITHUB_ENV
          echo "COMPOSE_DOCKER_CLI_BUILD=0" >> $GITHUB_ENV

      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Environment Secrets에서 .env.production 생성
      - name: Create .env.production from Environment Secrets
        run: |
          cat > .env.production << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      # 3. .env.production 파일을 서버에 업로드
      - name: Upload .env.production to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".env.production"
          target: "/home/ubuntu/my-blog-app/"
          overwrite: true

      # 4. SSH로 프로덕션 서버 접속 및 배포
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          # Timeout in seconds (30 minutes = 1800s)
          timeout: 1800
          # Keep SSH connection alive to prevent idle timeouts on long-running commands
          ssh_options: -o ServerAliveInterval=30 -o ServerAliveCountMax=3
          script_stop: true  # 에러 발생 시 즉시 중단
          script: |
            set -e
            echo "=========================================="
            echo "프로덕션 배포 시작: $(date)"
            echo "=========================================="

            cd /home/ubuntu/my-blog-app

            # 최신 코드 가져오기 (배포 스크립트 포함)
            echo "Step 0: Git Pull (main 브랜치)"
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Git Pull 완료"

            # 현재 커밋 해시 기록
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "현재 커밋: $CURRENT_COMMIT"
            
            # Triggering commit SHA (image tag)
            TRIGGER_COMMIT="${{ github.event.workflow_run.head_sha }}"
            if [ -z "$TRIGGER_COMMIT" ]; then
              TRIGGER_COMMIT="$CURRENT_COMMIT"
            fi
            echo "이미지 태그 (Commit SHA): $TRIGGER_COMMIT"

            # 이미지 Pull 모드로 배포 스크립트 실행
            echo "PULL_IMAGES=true 설정으로 배포"
            export IMAGE_TAG=$TRIGGER_COMMIT
            PULL_IMAGES=true bash scripts/deploy-production.sh

            echo "=========================================="
            echo "배포 완료: $(date)"
            echo "=========================================="

      # 3. 배포 실패 시 알림 (선택사항)
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ 프로덕션 배포 실패!"
          echo "롤백을 실행하세요: ssh ubuntu@server 'cd /home/ubuntu/my-blog-app && bash scripts/rollback.sh'"
          # Slack/Discord 알림 (선택사항)
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"❌ 프로덕션 배포 실패"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

      # 4. 배포 성공 시 알림 (선택사항)
      - name: Notify on success
        if: success()
        run: |
          echo "✅ 프로덕션 배포 성공!"
          # Slack/Discord 알림 (선택사항)
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"✅ 프로덕션 배포 성공"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
