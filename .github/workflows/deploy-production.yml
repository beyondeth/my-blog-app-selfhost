name: Deploy to Production (Oracle Free Tier)

# 메인 브랜치 푸시 시 자동 배포
on:
  push:
    branches:
      - main
  workflow_dispatch:  # 수동 실행 허용

# Concurrency control - 동시 실행 방지
concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 타임아웃 60분으로 단축
    environment: production  # Environment Secrets 사용

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Environment Secrets에서 .env.production 생성
      - name: Create .env.production from Environment Secrets
        run: |
          cat > .env.production << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      # 3. .env.production 파일을 서버에 업로드
      - name: Upload .env.production to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".env.production"
          target: "/home/ubuntu/my-blog-app/"
          overwrite: true

      # 4. SSH로 프로덕션 서버 접속 및 배포
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 3600  # 60분 타임아웃
          # Keep SSH connection alive
          command_timeout: 3600
          script_stop: true  # 에러 발생 시 즉시 중단
          script: |
            set -e
            echo "=========================================="
            echo "프로덕션 배포 시작: $(date)"
            echo "=========================================="

            cd /home/ubuntu/my-blog-app

            # 최신 코드 가져오기
            echo "Step 0: Git Pull (main 브랜치)"
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Git Pull 완료"

            # 현재 커밋 해시 기록
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "현재 커밋: $CURRENT_COMMIT"

            # 배포 스크립트 실행 (BuildKit + 병렬 빌드)
            echo "배포 스크립트 실행 중..."
            bash scripts/deploy-production.sh

            echo "=========================================="
            echo "배포 완료: $(date)"
            echo "=========================================="

      # 5. 배포 실패 시 알림
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ 프로덕션 배포 실패!"
          echo "롤백을 실행하세요: ssh ubuntu@server 'cd /home/ubuntu/my-blog-app && bash scripts/rollback.sh'"

      # 6. 배포 성공 시 알림
      - name: Notify on success
        if: success()
        run: |
          echo "✅ 프로덕션 배포 성공!"