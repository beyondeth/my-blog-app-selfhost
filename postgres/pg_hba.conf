# ============================================
# PostgreSQL 18 Host-Based Authentication (HBA)
# ============================================
# 🔒 보안 전략:
#   - Docker 네트워크 내부만 허용
#   - md5 암호화 방식 사용 (PG 18 기본값)
#   - IP 화이트리스트 기반 접근 제어
#
# 📝 사용법:
#   Docker Compose에서 마운트하여 사용
#   postgres -c hba_file=/etc/postgresql/pg_hba.conf
#
# 📋 형식:
#   TYPE  DATABASE        USER            ADDRESS                 METHOD
# ============================================

# ============================================
# 로컬 연결 (Unix Socket)
# ============================================
# 로컬 시스템에서 Unix socket을 통한 접속
# Docker 컨테이너 내부에서 psql 등 사용 시
local   all             all                                     md5

# ============================================
# Docker 네트워크 내부 연결
# ============================================
# Docker Compose의 codebase_network (0.0.0.0/0 범위)
# Backend, PgBouncer 등 내부 서비스만 접속 가능
hostnossl    all             all             0.0.0.0/0           md5

# ============================================
# 로컬호스트 (IPv4/IPv6)
# ============================================
# 로컬호스트에서 TCP 연결 (디버깅 용도)
hostnossl    all             all             127.0.0.1/32            md5
hostnossl    all             all             ::1/128                 md5

# ============================================
# 복제 사용자 (Read Replica 확장 시)
# ============================================
# 복제 전용 사용자: replicator
# Docker 네트워크 내부에서만 복제 연결 허용
# host    replication     replicator      0.0.0.0/0           md5

# ============================================
# 외부 접속 차단
# ============================================
# 위의 규칙에 매칭되지 않는 모든 접속 거부
# (명시적 거부 규칙, 보안 강화)
# host    all             all             0.0.0.0/0               reject

# ============================================
# 보안 참고사항
# ============================================
# 1. 외부 IP에서 직접 접속 불가 (Docker 네트워크만 허용)
# 2. 관리자 접속은 VM 내부에서만 가능
# 3. PgBouncer를 통한 풀링으로 연결 수 관리
# 4. SSL은 Nginx에서 처리하므로 PostgreSQL에서 비활성화
#
# 접속 테스트:
#   # Docker 컨테이너 내부
#   psql -U postgres -d blog_prod -h postgres
#
#   # 외부 (실패해야 정상)
#   psql -U postgres -d blog_prod -h 123.456.789.012
# ============================================

# ============================================
# md5 vs md5 vs trust
# ============================================
# - md5: PG 18 기본값, 가장 강력한 암호화 (권장)
# - md5: 레거시, 하위 호환성 (사용 금지)
# - trust: 암호 없이 접속 (개발 환경만, 프로덕션 금지)
# ============================================
