# ============================================
# PostgreSQL 18 프로덕션 최적화 설정
# ============================================
# 🎯 하드웨어: 1 OCPU (ARM), 8GB RAM, SSD 100GB
# 👥 동시 사용자: 5,000~10,000명 (PgBouncer 풀링)
# 🔧 최적화 전략:
#   - shared_buffers 2GB → 1.5GB (안정성 향상)
#   - work_mem 16MB (OLTP 워크로드)
#   - autovacuum 튜닝 (PG 18 동적 워커)
#
# 📝 사용법:
#   Docker Compose에서 마운트하여 사용
#   postgres -c config_file=/etc/postgresql/postgresql.conf
# ============================================

# ============================================
# 연결 설정
# ============================================
# 최대 연결 수 (PgBouncer가 관리, 실제 앱 연결은 1000개)
max_connections = 200

# Superuser 전용 연결 예약
superuser_reserved_connections = 3

# ============================================
# 메모리 설정
# ============================================
# 공유 메모리 (18.75% of 8GB → 안정성 우선)
# Prometheus 400MB → VictoriaMetrics 100MB로 절감한 메모리 활용
shared_buffers = 1536MB  # 1.5GB

# 쿼리당 작업 메모리 (OLTP 워크로드)
# 200 connections * 16MB = 3.2GB (안전)
work_mem = 16MB

# 유지보수 작업 메모리 (VACUUM, INDEX 생성, ANALYZE)
maintenance_work_mem = 512MB

# Autovacuum 작업 메모리 (worker당)
autovacuum_work_mem = 128MB

# 임시 파일 제한 (쿼리당)
temp_file_limit = 2GB

# 효과적인 캐시 크기 (OS 파일 캐시 포함 - 50% of 8GB)
effective_cache_size = 4GB

# ============================================
# WAL (Write-Ahead Log) 설정
# ============================================
# WAL 레벨 (복제 지원 - 추후 Read Replica 확장 대비)
wal_level = replica

# WAL 버퍼 크기
wal_buffers = 16MB

# 최소/최대 WAL 크기
min_wal_size = 1GB
max_wal_size = 4GB

# WAL 압축 (디스크 절약)
wal_compression = on

# WAL 로그 힌트 (pg_rewind 지원)
wal_log_hints = on

# WAL 파일 수 제한
wal_keep_size = 1GB

# ============================================
# 체크포인트 설정
# ============================================
# 체크포인트 주기 (디스크 I/O 분산)
checkpoint_timeout = 15min

# 체크포인트 완료 목표 (WAL 파일의 90%)
checkpoint_completion_target = 0.9

# 체크포인트 경고 (30초 이내 발생 시)
checkpoint_warning = 30s

# ============================================
# 쿼리 플래너 설정
# ============================================
# SSD 기준 랜덤 액세스 비용 (HDD는 4.0)
random_page_cost = 1.1

# SSD 병렬 I/O 동시성
effective_io_concurrency = 200


# ============================================
# 병렬 쿼리 설정
# ============================================
# ARM 1 OCPU = 2 cores 고려
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ============================================
# Autovacuum (PostgreSQL 18 개선 기능)
# ============================================
# Autovacuum 활성화
autovacuum = on

# 동적 워커 개수 조정 (PG 18 신기능)
autovacuum_max_workers = 3

# Autovacuum 실행 주기 (OLTP는 빈번하게)
autovacuum_naptime = 10s

# VACUUM 트리거 임계값
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1  # 10% 변경 시 VACUUM

# ANALYZE 트리거 임계값
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05  # 5% 변경 시 ANALYZE

# Vacuum 비용 제한 (I/O 부하 관리)
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 200

# Dead tuple 제거 적극성
autovacuum_vacuum_insert_threshold = 1000

# ============================================
# 로깅 설정
# ============================================
# 로그 수집기 활성화
logging_collector = on

# 로그 디렉토리 (Docker 환경에서는 stdout 사용)
log_directory = 'log'

# 로그 파일 이름 패턴
log_filename = 'postgresql-%Y-%m-%d.log'

# 로그 순환
log_rotation_age = 1d
log_rotation_size = 100MB

# 느린 쿼리 로깅 (1초 이상)
log_min_duration_statement = 1000

# 로그 라인 접두사
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# 체크포인트 로그
log_checkpoints = on

# 연결/종료 로그 (PgBouncer 사용 시 불필요)
log_connections = off
log_disconnections = off

# 락 대기 로그 (성능 문제 추적)
log_lock_waits = on

# 임시 파일 로그 (모든 임시 파일)
log_temp_files = 0

# Autovacuum 로그 (모든 실행)
log_autovacuum_min_duration = 0

# ============================================
# 통계 및 모니터링
# ============================================
# 통계 수집 확장 라이브러리
shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements 설정
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# 활동 추적
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# ============================================
# 보안 설정
# ============================================
# SSL (Nginx에서 SSL 종료하므로 비활성화)
ssl = off

# 비밀번호 암호화 방식 (PG 18 기본값: scrypt)
password_encryption = scram-sha-256

# ============================================
# 네트워크 및 타임아웃 설정
# ============================================
# 리스닝 주소 (Docker 네트워크 내부)
listen_addresses = '*'

# 포트
port = 5432

# TCP Keepalive 설정 (연결 유지)
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 3

# 클라이언트 타임아웃
idle_in_transaction_session_timeout = 300000  # 5분

# ============================================
# 기타 최적화
# ============================================
# JIT 컴파일 (ARM에서는 비활성화 권장)
jit = off

# 큰 데이터 처리 (트랜잭션당 락 테이블)
max_locks_per_transaction = 256

# 준비된 트랜잭션 (2PC, 사용하지 않음)
max_prepared_transactions = 0

# 파일 디스크립터 제한
max_files_per_process = 1000

# ============================================
# 로케일 및 문자 인코딩
# ============================================
# 로케일 (성능 우선)
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# 기본 문자 인코딩
default_text_search_config = 'pg_catalog.english'

# ============================================
# 백업 및 복제 설정 (추후 확장)
# ============================================
# Archive 모드 (백업용, 필요 시 활성화)
archive_mode = off
# archive_command = 'cp %p /mnt/data/postgres/archive/%f'

# 복제 슬롯 개수 (Read Replica 추가 시 설정)
max_replication_slots = 0

# WAL sender 프로세스
max_wal_senders = 0

# ============================================
# 설정 요약
# ============================================
# 메모리:
#   - shared_buffers: 1.5GB (18.75% of 8GB)
#   - work_mem: 16MB (total 3.2GB for 200 connections)
#   - effective_cache_size: 4GB (50% of 8GB)
#
# 성능:
#   - random_page_cost: 1.1 (SSD 최적화)
#   - max_parallel_workers: 4 (1 OCPU = 2 cores)
#   - autovacuum_max_workers: 3 (동적 조정)
#
# 디스크:
#   - wal_compression: on
#   - max_wal_size: 4GB
#   - checkpoint_timeout: 15min
#
# 예상 성능:
#   - 동시 연결: 200개 (PgBouncer 1,000개 관리)
#   - 쿼리 응답: p95 < 100ms
#   - VACUUM 빈도: 10초마다 확인
# ============================================
