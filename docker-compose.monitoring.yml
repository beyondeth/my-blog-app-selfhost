# Docker Compose for Prometheus + Grafana Monitoring Stack
# 채팅 큐 시스템 모니터링을 위한 설정
version: '3.8'

services:
  # Prometheus - 메트릭 수집 및 저장
  prometheus:
    image: prom/prometheus:latest
    container_name: chat-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"  # Bind to localhost only for security
    networks:
      - monitoring
    restart: unless-stopped

  # Grafana - 대시보드 및 시각화
  grafana:
    image: grafana/grafana:latest
    container_name: chat-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3030
      - GF_SECURITY_ALLOW_EMBEDDING=true
    ports:
      - "127.0.0.1:3030:3000"  # Bind to localhost only, port 3030 (Next.js와 충돌 방지)
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

  # Redis Exporter - Redis 메트릭 수집
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: chat-redis-exporter
    environment:
      - REDIS_ADDR=host.docker.internal:6379
      - REDIS_PASSWORD=
    ports:
      - "127.0.0.1:9121:9121"  # Bind to localhost only for security
    networks:
      - monitoring
    restart: unless-stopped

  # Node Exporter - 시스템 메트릭 수집 (선택사항)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: chat-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"  # Bind to localhost only for security
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local