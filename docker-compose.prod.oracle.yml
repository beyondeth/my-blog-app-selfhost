# ============================================
# Codebase 블로그 플랫폼 - Oracle Free Tier 프로덕션 설정
# ============================================
# 🎯 목표: 오라클 무료 티어 (4 OCPU, 24GB RAM) 단일 인스턴스 최적화
# 🔧 변경사항:
#   - Prometheus → VictoriaMetrics (메모리 75% 절감)
#   - PostgreSQL shared_buffers 2GB → 1.5GB
#   - Redis maxmemory 5.5GB → 3.5GB
#   - CPU Quota 3.8 OCPU (20% 여유 유지)
#
# 📝 사용법:
#   docker compose -f docker-compose.prod.oracle.yml up -d --build
#
# ⚠️ 사전 준비:
#   1. .env.production 파일 생성 필수
#   2. Nginx 네이티브 설치 (Reverse Proxy용)
#   3. /mnt/data 디렉토리 마운트 (Block Volume)
# ============================================


services:
  # ============================================
  # Frontend (Next.js Standalone)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
      target: runner
      # 빌드 타임 환경변수 (Next.js NEXT_PUBLIC_* 변수 주입)
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://www.codebase.blog/api/v1}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://www.codebase.blog}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.codebase.blog}
        NEXT_PUBLIC_MIXPANEL_TOKEN: ${NEXT_PUBLIC_MIXPANEL_TOKEN}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-frontend
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # Backend API는 내부 Docker 네트워크로 통신
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://www.codebase.blog/api/v1}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://www.codebase.blog}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.codebase.blog}
      NEXT_PUBLIC_MIXPANEL_TOKEN: ${NEXT_PUBLIC_MIXPANEL_TOKEN}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3001:3000"  # Next.js는 내부적으로 3000 포트 사용
    networks:
      - codebase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 리소스 제한 (SSR 중심 Next.js)
    cpus: 1.0
    mem_limit: 2g
    mem_reservation: 1.5g

  # ============================================
  # Backend (NestJS + PM2 Cluster)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-backend
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # PgBouncer 연결 (연결 풀링)
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@pgbouncer:5432/${DB_NAME:-blog_prod}
      REDIS_URL: redis://redis:6379
      # PM2 워커당 힙 메모리 (ecosystem.config.js와 일치)
      NODE_OPTIONS: "--max-old-space-size=800"
      UV_THREADPOOL_SIZE: 8
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codebase_network
    restart: unless-stopped
    # PM2는 Dockerfile CMD에서 실행 (pm2-runtime)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # PM2 Cold Start 고려 (daemon spawning + 워커 시작)
    # 리소스 제한 (PM2 4 워커)
    cpus: 3.0
    mem_limit: 4g
    mem_reservation: 3g

  # ============================================
  # PostgreSQL 18 (Async I/O, ARM64 최적화)
  # ============================================
  postgres:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-blog_prod}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # 성능 최적화 환경변수
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      # Block Volume 사용 (100GB)
      - /mnt/data/postgres:/var/lib/postgresql
      # 최적화된 PostgreSQL 설정 (shared_buffers 조정 필요)
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - codebase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-blog_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 리소스 제한 (CPU 무제한, 피크 타임만 사용)
    mem_limit: 7.5g
    mem_reservation: 5g
    shm_size: 512mb  # 공유 메모리

  # ============================================
  # PgBouncer (연결 풀링) - edoburu 이미지 (ARM64/AMD64 지원)
  # ============================================
  # 🎯 설계 기준: 1만 명 동시 사용자 (블로그 플랫폼 읽기 위주)
  #   - PM2 워커: 1-4개 (동적 스케일링)
  #   - 워커당 연결: 20개
  #   - 피크 타임: 80개 (4 워커 × 20)
  #   - 심야 시간: 20개 (1 워커 × 20)
  #   - PostgreSQL max_connections: 200 (50% 활용 = 100개)
  # ============================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-pgbouncer
    environment:
      # PostgreSQL 백엔드 연결 정보
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-blog_prod}
      # SCRAM 인증 지원
      AUTH_TYPE: scram-sha-256
      # 풀링 모드 (읽기 위주 워크로드에 최적)
      POOL_MODE: transaction
      # 클라이언트 연결 제한 (1만 명 수용)
      MAX_CLIENT_CONN: 10000
      # 데이터베이스 연결 풀 크기
      DEFAULT_POOL_SIZE: 80   # 피크 타임 (4 워커 × 20)
      MIN_POOL_SIZE: 20       # 심야 시간 (1 워커 × 20)
      RESERVE_POOL_SIZE: 20   # 버스트 대비
      # PostgreSQL 연결 제한
      MAX_DB_CONNECTIONS: 100 # PostgreSQL max_connections=200의 50%
      MAX_USER_CONNECTIONS: 100
      # 타임아웃 설정 (초)
      SERVER_IDLE_TIMEOUT: 600     # 유휴 서버 연결 10분
      QUERY_TIMEOUT: 30            # 쿼리 타임아웃 30초
      IDLE_TRANSACTION_TIMEOUT: 60 # 유휴 트랜잭션 1분
      # 로그 설정 (프로덕션 최소화)
      VERBOSE: 0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codebase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    # 리소스 제한
    cpus: 0.2
    mem_limit: 128m
    mem_reservation: 64m

  # ============================================
  # Redis (캐시 + 큐 + 소켓)
  # ============================================
  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-redis
    command: >
      redis-server
      --maxmemory 4000mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1 300 10 60 10000
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --maxclients 10000
      --hz 10
      --io-threads 2
      --io-threads-do-reads yes
    volumes:
      - /mnt/data/redis:/data
    networks:
      - codebase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # 리소스 제한 (4GB maxmemory + 여유)
    cpus: 1.5
    mem_limit: 4.5g
    mem_reservation: 3.5g

  # ============================================
  # MCP Proxy (MCP 자동 포스팅 API)
  # ============================================
  mcp-proxy:
    build:
      context: ./mcp-proxy-server
      dockerfile: Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-mcp-proxy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codebase_network
    restart: unless-stopped
    command: node dist/index.js
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 리소스 제한
    cpus: 1.0
    mem_limit: 800m
    mem_reservation: 500m

  # ============================================
  # VictoriaMetrics (Prometheus 대체)
  # ============================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.97.0
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-victoriametrics
    command:
      - '--storageDataPath=/storage'
      - '--retentionPeriod=30d'  # Prometheus 15일 → VictoriaMetrics 30일
      - '--promscrape.config=/etc/victoriametrics/scrape_config.yml'
      - '--promscrape.config.strictParse=false'  # Prometheus 호환성을 위한 엄격한 파싱 비활성화
      - '--httpListenAddr=:8428'
      # 메모리 최적화
      - '--memory.allowedPercent=80'
    volumes:
      - /mnt/data/victoriametrics:/storage
      - ./victoriametrics/scrape_config.yml:/etc/victoriametrics/scrape_config.yml:ro
      - ./victoriametrics/alerts.yml:/etc/victoriametrics/alerts.yml:ro
    networks:
      - codebase_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8428/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 리소스 제한 (Prometheus 400MB → VictoriaMetrics 100MB)
    cpus: 0.1
    mem_limit: 100m
    mem_reservation: 50m

  # ============================================
  # Grafana (모니터링 대시보드)
  # ============================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-grafana
    env_file:
      - .env.production
    volumes:
      - /mnt/data/grafana:/var/lib/grafana
      # VictoriaMetrics 데이터소스 설정
      - ./grafana/provisioning/datasources/victoriametrics.yml:/etc/grafana/provisioning/datasources/victoriametrics.yml:ro
      - ./grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      # 대시보드 파일 디렉토리
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_INSTALL_PLUGINS=  # 플러그인 불필요 (VictoriaMetrics는 Prometheus 호환)
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      # 나머지 설정은 .env.production에서 로드
      # GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD
      # GRAFANA_ROOT_URL -> GF_SERVER_ROOT_URL
      # GF_LOG_LEVEL
    ports:
      - "127.0.0.1:3030:3000"
    networks:
      - codebase_network
    depends_on:
      - victoriametrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 리소스 제한
    cpus: 0.2
    mem_limit: 300m
    mem_reservation: 150m

  # ============================================
  # Redis Exporter (Redis 메트릭 수집)
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:latest  # ARM64 호환
    container_name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-redis-exporter
    command:
      - '--redis.addr=redis:6379'
      - '--include-system-metrics=false'  # 시스템 메트릭 제외 (CPU 절약)
    networks:
      - codebase_network
    restart: unless-stopped
    # healthcheck 제거: 최신 이미지는 distroless로 wget/curl 없음
    # VictoriaMetrics가 정상적으로 메트릭 수집 중
    # 리소스 제한
    cpus: 0.1
    mem_limit: 50m
    mem_reservation: 20m

# ============================================
# 네트워크 설정
# ============================================
networks:
  codebase_network:
    name: ${COMPOSE_PROJECT_NAME:-codebase-prod}-network
    driver: bridge

# ============================================
# 볼륨 설정 (외부 마운트 사용)
# ============================================
# Block Volume을 /mnt/data에 마운트하여 사용
# 별도 Named Volume 불필요

# ============================================
# 리소스 사용 요약 (PM2 Cluster + 자동 스케일링)
# ============================================
# 총 CPU: ~7.1 OCPU 설정 (PostgreSQL 무제한, 피크 타임만 사용)
# 총 RAM: 19.38 GB (24 GB 중 80.7%, 4.62 GB 여유)
#
# 🎯 Oracle Free Tier 할당량:
#   - 월 3,000 OCPU시간 (평균 4.17 OCPU)
#   - 월 18,000 GB시간 (평균 25 GB)
#   - 자동 스케일링으로 평균 3.5 OCPU 이하 유지 (62% 사용)
#
# 서비스별 CPU/RAM:
#   frontend:         1.0 OCPU, 2 GB (SSR 중심 Next.js)
#   backend:          3.0 OCPU, 4 GB (PM2 4 워커)
#   postgres:         무제한, 7.5 GB (Async I/O, ARM64 최적화)
#   pgbouncer:        0.2 OCPU, 128 MB (연결 풀링, ARM64 지원)
#   redis:            1.5 OCPU, 4.5 GB (maxmemory 4GB)
#   mcp-proxy:        1.0 OCPU, 800 MB
#   victoriametrics:  0.1 OCPU, 100 MB
#   grafana:          0.2 OCPU, 300 MB
#   redis-exporter:   0.1 OCPU, 50 MB
#
# 🔄 동적 스케일링 시나리오:
#   - 피크 타임: PM2 4 워커 → ~4.1 OCPU (8시간/일)
#   - 일반 시간: PM2 2 워커 → ~3.1 OCPU (10시간/일)
#   - 심야 시간: PM2 1 워커 → ~2.1 OCPU (6시간/일)
#   - 월 평균: ~2,016 OCPU시간 (< 3,000 안전, 67% 사용)
# ============================================
