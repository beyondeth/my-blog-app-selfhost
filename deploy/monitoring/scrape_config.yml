global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: backend
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: [backend:3000]

  - job_name: mcp-proxy
    metrics_path: /metrics
    static_configs:
      - targets: [mcp-proxy:3002]

  - job_name: victoriametrics
    static_configs:
      - targets: [victoriametrics:8428]
