# ============================================
# PostgreSQL 18 프로덕션 설정
# ============================================
# OCI Free Tier ARM (4 vCPU, 24GB RAM) 최적화
# ============================================

# --------------------------------------------
# 연결 설정
# --------------------------------------------
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# --------------------------------------------
# 메모리 설정
# --------------------------------------------
# shared_buffers: 전체 RAM의 25% (24GB의 25% = 6GB)
shared_buffers = 6GB

# effective_cache_size: 전체 RAM의 50% (캐시 예상치)
effective_cache_size = 12GB

# work_mem: 정렬 및 해시 작업에 사용 (16MB * 200 connections = 최대 3.2GB)
work_mem = 16MB

# maintenance_work_mem: VACUUM, CREATE INDEX 등에 사용
maintenance_work_mem = 1GB

# huge_pages: ARM 환경에서 성능 향상 시도
huge_pages = try

# --------------------------------------------
# PostgreSQL 18 비동기 I/O 설정
# --------------------------------------------
# io_method: worker (공식 이미지 기본값, io_uring은 커스텀 빌드 필요)
io_method = worker

# effective_io_concurrency: SSD 스토리지를 위한 병렬 I/O 요청 수
effective_io_concurrency = 200

# maintenance_io_concurrency: VACUUM 등 유지보수 작업의 병렬 I/O
maintenance_io_concurrency = 200

# --------------------------------------------
# 병렬 처리 설정 (ARM 4 Core 최적화)
# --------------------------------------------
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
max_parallel_workers = 4

# --------------------------------------------
# WAL (Write-Ahead Logging) 설정
# --------------------------------------------
wal_buffers = 16MB
wal_writer_delay = 200ms
wal_compression = on

# --------------------------------------------
# 체크포인트 설정
# --------------------------------------------
checkpoint_timeout = 15min
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# --------------------------------------------
# 쿼리 플래너 설정 (SSD 최적화)
# --------------------------------------------
# random_page_cost: SSD의 경우 1.0으로 설정 (HDD 기본값 4.0)
random_page_cost = 1.0

# seq_page_cost: 순차 읽기 비용
seq_page_cost = 1.0

# cpu_tuple_cost: ARM CPU 최적화
cpu_tuple_cost = 0.01

# cpu_index_tuple_cost: 인덱스 처리 비용
cpu_index_tuple_cost = 0.005

# cpu_operator_cost: 연산자 처리 비용
cpu_operator_cost = 0.0025

# --------------------------------------------
# 로깅 설정
# --------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = off

# 로그 라인 포맷
log_line_prefix = '%m [%p] %u@%d '

# 로깅할 이벤트
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = 0

# 슬로우 쿼리 로깅 (1초 이상)
log_min_duration_statement = 1000

# 에러 레벨 설정
log_min_messages = warning
log_min_error_statement = error

# --------------------------------------------
# 성능 모니터링
# --------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
track_activity_query_size = 2048

# --------------------------------------------
# 자동 VACUUM 설정
# --------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 400

# --------------------------------------------
# 보안 설정
# --------------------------------------------
# MD5 인증 폐기 예정 (PostgreSQL 18 권장)
password_encryption = scram-sha-256

# SSL 설정 (프로덕션에서는 활성화 권장)
# ssl = on
# ssl_cert_file = '/path/to/server.crt'
# ssl_key_file = '/path/to/server.key'

# --------------------------------------------
# 타임존 설정
# --------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'

# --------------------------------------------
# 로케일 설정
# --------------------------------------------
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# --------------------------------------------
# 연결 타임아웃
# --------------------------------------------
statement_timeout = 30000  # 30초
lock_timeout = 10000       # 10초
idle_in_transaction_session_timeout = 300000  # 5분

# --------------------------------------------
# 기타 최적화
# --------------------------------------------
# 통계 수집
default_statistics_target = 100

# 공유 메모리 설정
dynamic_shared_memory_type = posix

# JIT 컴파일 (메모리가 충분하면 활성화)
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000
