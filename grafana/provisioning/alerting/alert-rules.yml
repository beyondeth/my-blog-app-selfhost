apiVersion: 1

deleteRules:
  - orgId: 1
    uid: victoriametrics-down
  - orgId: 1
    uid: cpu-high-scale-down
  - orgId: 1
    uid: memory-high
  - orgId: 1
    uid: backend-memory-high
  - orgId: 1
    uid: postgresql-memory-high

groups:
  - name: core-availability
    folder: Codebase Ops
    interval: 30s
    rules:
      - uid: backend-down
        title: Backend 응답 중단
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: sum(up{job="nestjs-backend"}) < bool 1
              hide: false
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Backend 응답 중단"
          impact: "웹 API와 자동포스팅이 실패할 수 있습니다."
          action: "backend 컨테이너 상태와 /health 응답을 확인하세요."
        labels:
          severity: critical
          component: backend

      - uid: mcp-proxy-down
        title: MCP Proxy 응답 중단
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: sum(up{job="mcp-proxy-server"}) < bool 1
              hide: false
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "MCP Proxy 응답 중단"
          impact: "ChatGPT 자동포스팅과 MCP 연결이 실패할 수 있습니다."
          action: "mcp-proxy 컨테이너와 /metrics, /health, OAuth 경로를 확인하세요."
        labels:
          severity: critical
          component: mcp-proxy

      - uid: redis-down
        title: Redis 연결 이상
        condition: B
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: victoriametrics
            model:
              expr: min(redis_up) < bool 1
              hide: false
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: "-100"
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Redis 연결 이상"
          impact: "캐시, 큐, 세션 계층이 불안정해질 수 있습니다."
          action: "redis exporter와 실제 redis-core/redis-cache 컨테이너 상태를 확인하세요."
        labels:
          severity: critical
          component: redis
