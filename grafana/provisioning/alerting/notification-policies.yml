apiVersion: 1

policies:
  - orgId: 1
    receiver: silent-drop
    group_by:
      - alertname
      - component
      - severity
    group_wait: 2m
    group_interval: 15m
    repeat_interval: 12h
    routes:
      - receiver: telegram-ops
        object_matchers:
          - - severity
            - =
            - critical
        group_by:
          - alertname
          - component
          - severity
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 30m
      - receiver: telegram-ops
        object_matchers:
          - - severity
            - =
            - warning
        group_by:
          - alertname
          - component
          - severity
        group_wait: 5m
        group_interval: 15m
        repeat_interval: 6h
