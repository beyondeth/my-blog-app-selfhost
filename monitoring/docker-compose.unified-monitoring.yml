# ============================================
# Codebase 통합 모니터링 스택
# ============================================
# Docker Compose for Unified Prometheus + Grafana Monitoring Stack
# Backend, MCP Proxy, Redis, System 통합 모니터링
#
# 사용법:
#   cd monitoring
#   docker compose -f docker-compose.unified-monitoring.yml up -d
#
# 접속 정보:
#   Grafana (개발): http://localhost:3033 (admin/admin)
#   VictoriaMetrics (개발): http://localhost:8428
# ============================================

services:
  # ============================================
  # VictoriaMetrics - 메트릭 수집 및 저장 (개발 환경)
  # ============================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.97.0
    container_name: codebase-dev-monitoring-victoriametrics
    command:
      - '--storageDataPath=/storage'
      - '--retentionPeriod=30d'
      - '--promscrape.config=/etc/victoriametrics/scrape_config.yml'
      - '--promscrape.config.strictParse=false'
      - '--httpListenAddr=:8428'
      - '--memory.allowedPercent=80'
    volumes:
      - ./victoriametrics/scrape_config.yml:/etc/victoriametrics/scrape_config.yml:ro
      - ./victoriametrics/alerts.yml:/etc/victoriametrics/alerts.yml:ro
      - victoriametrics_data:/storage
    ports:
      - "127.0.0.1:8428:8428"  # VictoriaMetrics HTTP API
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8428/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 100M
        reservations:
          cpus: '0.05'
          memory: 50M

  # ============================================
  # Grafana - 통합 대시보드 및 시각화 (개발 환경)
  # ============================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: codebase-dev-monitoring-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      # 통합 Grafana provisioning 설정 (2개 대시보드로 감소)
      - ./grafana/provisioning:/etc/grafana/provisioning
      # 대시보드 파일 디렉토리
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3033
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      # 로그 레벨 (개발: debug, 운영: info)
      - GF_LOG_LEVEL=${GF_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3033:3000"  # 개발 환경 전용 포트 (VM SSH 터널 3030과 분리)
    networks:
      - monitoring
    depends_on:
      - victoriametrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'          # 최대 0.2 OCPU
          memory: 300M         # 최대 300MB (현재 134MB → 여유 2배)
        reservations:
          cpus: '0.05'
          memory: 100M

  # ============================================
  # Redis Exporter - Redis 메트릭 수집 (개발 환경)
  # ============================================
  redis-core-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: codebase-dev-monitoring-redis-core-exporter
    command:
      # CPU 9% 문제 해결: 과도한 메트릭 제거
      - '--redis.addr=codebase-dev-redis-core:6379'
      - '--include-system-metrics=false'  # 시스템 메트릭 제외
    ports:
      - "127.0.0.1:9121:9121"  # Bind to localhost only for security
    networks:
      - monitoring
      - codebase-dev-network  # Redis와 같은 네트워크 추가
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-cache-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: codebase-dev-monitoring-redis-cache-exporter
    command:
      - '--redis.addr=codebase-dev-redis-cache:6379'
      - '--include-system-metrics=false'
    ports:
      - "127.0.0.1:9122:9121"
    networks:
      - monitoring
      - codebase-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'          # CPU 사용률 제한 (9% → 0.3%)
          memory: 50M
        reservations:
          cpus: '0.02'
          memory: 20M

networks:
  monitoring:
    driver: bridge
    name: codebase-monitoring-network
  codebase-dev-network:
    external: true
    name: codebase-dev-network  # Redis 네트워크 이름 (docker-compose.dev.yml)

volumes:
  victoriametrics_data:
    driver: local
    name: codebase-dev-monitoring-victoriametrics-data
  grafana_data:
    driver: local
    name: codebase-dev-monitoring-grafana-data
