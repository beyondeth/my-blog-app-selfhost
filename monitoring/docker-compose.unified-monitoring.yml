# ============================================
# Codebase 통합 모니터링 스택
# ============================================
# Docker Compose for Unified Prometheus + Grafana Monitoring Stack
# Backend, MCP Proxy, Redis, System 통합 모니터링
#
# 사용법:
#   cd monitoring
#   docker compose -f docker-compose.unified-monitoring.yml up -d
#
# 접속 정보:
#   Grafana: http://localhost:3030 (admin/admin)
#   Prometheus: http://localhost:9090
# ============================================

services:
  # ============================================
  # Prometheus - 메트릭 수집 및 저장
  # ============================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: codebase-monitoring-prometheus
    volumes:
      # 통합 Prometheus 설정 파일 (Backend + MCP + Redis 타겟)
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--web.enable-lifecycle'             # 설정 리로드 활성화
    ports:
      - "127.0.0.1:9090:9090"  # Bind to localhost only for security
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Grafana - 통합 대시보드 및 시각화
  # ============================================
  grafana:
    image: grafana/grafana:11.3.0
    container_name: codebase-monitoring-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      # 통합 Grafana provisioning 설정 (5개 대시보드)
      - ./grafana/provisioning:/etc/grafana/provisioning
      # 대시보드 파일 디렉토리
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3030
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_USERS_ALLOW_SIGN_UP=false
      # 로그 레벨 (개발: debug, 운영: info)
      - GF_LOG_LEVEL=${GF_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3030:3000"  # Bind to localhost only, port 3030 (Backend 3000과 충돌 방지)
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Redis Exporter - Redis 메트릭 수집
  # ============================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: codebase-monitoring-redis-exporter
    environment:
      # Backend와 MCP가 사용하는 Redis 인스턴스
      # 로컬 개발: my-blog-app-shared-redis (Docker 네트워크 내부)
      # 프로덕션: redis (docker-compose 서비스명)
      - REDIS_ADDR=my-blog-app-shared-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:9121:9121"  # Bind to localhost only for security
    networks:
      - monitoring
      - my-blog-app-network  # Redis와 같은 네트워크 추가
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis_exporter", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Node Exporter - 시스템 메트릭 수집
  # ============================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: codebase-monitoring-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"  # Bind to localhost only for security
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  monitoring:
    driver: bridge
    name: codebase-monitoring-network
  my-blog-app-network:
    external: true
    name: my-blog-app-network  # 기존 Redis 네트워크 이름

volumes:
  prometheus_data:
    driver: local
    name: codebase-prometheus-data
  grafana_data:
    driver: local
    name: codebase-grafana-data
