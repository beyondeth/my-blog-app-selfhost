groups:
  - name: core_service_alerts
    interval: 30s
    rules:
      - alert: BackendDown
        expr: sum(up{job="nestjs-backend"}) < bool 1
        for: 1m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend 응답 중단"
          impact: "웹 API와 자동포스팅이 실패할 수 있습니다."
          action: "backend 컨테이너 상태와 /health 응답을 확인하세요."

      - alert: MCPProxyDown
        expr: sum(up{job="mcp-proxy-server"}) < bool 1
        for: 1m
        labels:
          severity: critical
          component: mcp-proxy
        annotations:
          summary: "MCP Proxy 응답 중단"
          impact: "ChatGPT 자동포스팅과 MCP 연결이 실패할 수 있습니다."
          action: "mcp-proxy 컨테이너와 /metrics, /health, OAuth 경로를 확인하세요."

      - alert: RedisUnavailable
        expr: min(redis_up) < bool 1
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis 연결 이상"
          impact: "캐시, 큐, 세션 계층이 불안정해질 수 있습니다."
          action: "redis exporter와 실제 redis-core/redis-cache 컨테이너 상태를 확인하세요."
