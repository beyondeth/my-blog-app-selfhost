# Prometheus Alert 규칙
# 채팅 큐 시스템 알림 설정

groups:
  - name: chat_queue_alerts
    interval: 30s
    rules:
      # 큐 크기 경고
      - alert: HighQueueSize
        expr: chat_queue_size > 500
        for: 5m
        labels:
          severity: warning
          component: chat-queue
        annotations:
          summary: "채팅 큐 크기가 높습니다"
          description: "큐 크기가 {{ $value }}개로 500개를 초과했습니다. (인스턴스: {{ $labels.instance }})"

      # 큐 크기 위험
      - alert: CriticalQueueSize
        expr: chat_queue_size > 1000
        for: 2m
        labels:
          severity: critical
          component: chat-queue
        annotations:
          summary: "채팅 큐 크기가 위험 수준입니다"
          description: "큐 크기가 {{ $value }}개로 1000개를 초과했습니다. 즉시 조치가 필요합니다."

      # DLQ 크기 경고
      - alert: HighDLQSize
        expr: chat_dlq_size > 50
        for: 5m
        labels:
          severity: warning
          component: chat-dlq
        annotations:
          summary: "Dead Letter Queue에 메시지가 쌓이고 있습니다"
          description: "DLQ 크기가 {{ $value }}개입니다. 실패한 메시지를 확인하세요."

      # DLQ 크기 위험
      - alert: CriticalDLQSize
        expr: chat_dlq_size > 100
        for: 2m
        labels:
          severity: critical
          component: chat-dlq
        annotations:
          summary: "Dead Letter Queue가 위험 수준입니다"
          description: "DLQ 크기가 {{ $value }}개로 100개를 초과했습니다. 시스템에 문제가 있을 수 있습니다."

      # 배치 처리 실패
      - alert: BatchProcessingFailure
        expr: rate(chat_messages_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: batch-processor
        annotations:
          summary: "배치 처리 실패율이 높습니다"
          description: "5분간 평균 실패율이 {{ $value | humanizePercentage }}입니다."

      # 연속 실패
      - alert: ConsecutiveFailures
        expr: chat_consecutive_failures > 3
        for: 1m
        labels:
          severity: critical
          component: batch-processor
        annotations:
          summary: "배치 처리가 연속으로 실패하고 있습니다"
          description: "연속 {{ $value }}회 실패했습니다. 배치 처리가 중단될 수 있습니다."

      # 처리 속도 저하
      - alert: SlowProcessing
        expr: chat_batch_duration_seconds > 5
        for: 10m
        labels:
          severity: warning
          component: batch-processor
        annotations:
          summary: "배치 처리 속도가 느립니다"
          description: "평균 처리 시간이 {{ $value }}초입니다."

      # Redis 연결 실패
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis 서버가 다운되었습니다"
          description: "Redis 서버에 연결할 수 없습니다. 채팅 큐가 작동하지 않습니다."

      # NestJS 앱 다운
      - alert: NestJSDown
        expr: up{job="nestjs-chat-app"} == 0
        for: 1m
        labels:
          severity: critical
          component: nestjs
        annotations:
          summary: "NestJS 애플리케이션이 다운되었습니다"
          description: "NestJS 앱에 연결할 수 없습니다."

      # 메모리 사용량 경고
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="nestjs-chat-app"} > 1073741824
        for: 5m
        labels:
          severity: warning
          component: nestjs
        annotations:
          summary: "NestJS 앱 메모리 사용량이 높습니다"
          description: "메모리 사용량이 {{ $value | humanize1024 }}B입니다."

      # CPU 사용량 임계값 (80% 초과)
      - alert: HighCPUUsage
        expr: rate(nodejs_process_cpu_seconds_total{job="nestjs-chat-app"}[5m]) > 0.8
        for: 5m
        labels:
          severity: critical
          component: nestjs
        annotations:
          summary: "CPU 사용량이 80%를 초과했습니다"
          description: "CPU 사용률: {{ $value | humanizePercentage }}"

      # 메모리 임계값 위험 (8GB 초과)
      - alert: CriticalMemoryUsage
        expr: nodejs_process_resident_memory_bytes{job="nestjs-chat-app"} > 8000000000
        for: 5m
        labels:
          severity: critical
          component: nestjs
        annotations:
          summary: "메모리 사용량이 8GB를 초과했습니다"
          description: "메모리: {{ $value | humanize1024 }}B"

      # Redis 연결 상태 (채팅 큐)
      - alert: ChatRedisConnectionLost
        expr: chat_redis_connection_status == 0
        for: 1m
        labels:
          severity: critical
          component: chat-redis
        annotations:
          summary: "채팅 시스템의 Redis 연결이 끊어졌습니다"
          description: "Redis 연결 복구 필요"

      # 큐 적체 (1000개 초과)
      - alert: QueueBacklog
        expr: chat_queue_size > 1000
        for: 5m
        labels:
          severity: warning
          component: chat-queue
        annotations:
          summary: "채팅 큐 적체 (1000개 초과)"
          description: "현재 큐 크기: {{ $value }}개"

      # MCP Proxy 다운
      - alert: MCPProxyDown
        expr: up{job="mcp-proxy-server"} == 0
        for: 1m
        labels:
          severity: critical
          component: mcp-proxy
        annotations:
          summary: "MCP Proxy 서버가 다운되었습니다"
          description: "MCP Proxy 서버에 연결할 수 없습니다"

  # ============================================
  # Oracle Free Tier 리소스 모니터링
  # ============================================
  - name: oracle_resource_alerts
    interval: 30s
    rules:
      # CPU 사용률 90% 이상 (PM2 Scale Down 필요)
      - alert: HighCPUUsageScaleDown
        expr: sum(rate(container_cpu_usage_seconds_total[5m])) / 4 > 0.9
        for: 5m
        labels:
          severity: critical
          component: resource
          action: scale_down
        annotations:
          summary: "CPU 사용률 90% 초과 - PM2 워커 감소 필요"
          description: "평균 CPU 사용률: {{ $value | humanizePercentage }}. PM2 워커를 줄이세요."

      # CPU 사용률 70% 이상 (경고)
      - alert: ModerateHighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total[5m])) / 4 > 0.7 and sum(rate(container_cpu_usage_seconds_total[5m])) / 4 <= 0.9
        for: 10m
        labels:
          severity: warning
          component: resource
        annotations:
          summary: "CPU 사용률 70% 초과"
          description: "평균 CPU 사용률: {{ $value | humanizePercentage }}. 모니터링 필요."

      # CPU 사용률 50% 이하 (PM2 Scale Up 가능)
      - alert: LowCPUUsageScaleUp
        expr: sum(rate(container_cpu_usage_seconds_total[5m])) / 4 < 0.5
        for: 10m
        labels:
          severity: info
          component: resource
          action: scale_up
        annotations:
          summary: "CPU 사용률 50% 이하 - PM2 워커 증가 가능"
          description: "평균 CPU 사용률: {{ $value | humanizePercentage }}. PM2 워커를 늘릴 수 있습니다."

      # 메모리 사용률 85% 이상 (위험)
      - alert: HighMemoryUsageOracleTier
        expr: (sum(container_memory_usage_bytes) / (24 * 1024 * 1024 * 1024)) > 0.85
        for: 3m
        labels:
          severity: critical
          component: resource
        annotations:
          summary: "메모리 사용률 85% 초과"
          description: "현재 메모리 사용: {{ $value | humanizePercentage }}. OOM 위험."

      # 메모리 사용률 75% 이상 (경고)
      - alert: ModerateHighMemoryUsage
        expr: (sum(container_memory_usage_bytes) / (24 * 1024 * 1024 * 1024)) > 0.75 and (sum(container_memory_usage_bytes) / (24 * 1024 * 1024 * 1024)) <= 0.85
        for: 5m
        labels:
          severity: warning
          component: resource
        annotations:
          summary: "메모리 사용률 75% 초과"
          description: "현재 메모리 사용: {{ $value | humanizePercentage }}. 주의 필요."

      # PostgreSQL 메모리 높음
      - alert: PostgreSQLHighMemory
        expr: container_memory_usage_bytes{name=~".*postgres.*"} > 7 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
          component: postgresql
        annotations:
          summary: "PostgreSQL 메모리 사용량 높음"
          description: "현재 사용량: {{ $value | humanize1024 }}B (제한: 7.5GB)"

      # Redis 메모리 높음
      - alert: RedisHighMemory
        expr: container_memory_usage_bytes{name=~".*redis.*"} > 4.3 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis 메모리 사용량 높음"
          description: "현재 사용량: {{ $value | humanize1024 }}B (제한: 4.5GB)"

      # Backend 메모리 높음 (PM2)
      - alert: BackendHighMemory
        expr: container_memory_usage_bytes{name=~".*backend.*"} > 3.8 * 1024 * 1024 * 1024
        for: 3m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend 메모리 사용량 높음"
          description: "현재 사용량: {{ $value | humanize1024 }}B (제한: 4GB)"

      # 월 할당량 경고 (CPU)
      # 월초부터 누적 OCPU시간 계산 (대략적)
      # 실제로는 외부 모니터링 필요
      - alert: MonthlyCPUQuotaWarning
        expr: sum(rate(container_cpu_usage_seconds_total[1h])) * 720 > 2700
        for: 1h
        labels:
          severity: warning
          component: resource
          quota: cpu
        annotations:
          summary: "월 OCPU 할당량 90% 초과 예상"
          description: "현재 속도로 사용 시 월 3,000 OCPU시간을 초과할 수 있습니다."